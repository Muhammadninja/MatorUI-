appId: com.mator.e2e
---
- openLink: mator-e2e://sign-in
- extendedWaitUntil:
    visible:
      id: auth-phone-field
    timeout: 15000
- waitForAnimationToEnd
- copyTextFrom:
    id: auth-phone-field
- assertTrue: ${maestro.copiedText === '' || maestro.copiedText === '+998 90 123 45 67'}
- tapOn:
    id: auth-phone-field
    retryTapIfNoChange: false
- waitForAnimationToEnd
- inputText: ${PHONE}
- copyTextFrom:
    id: auth-phone-field
- assertTrue: ${maestro.copiedText.replace(/\D/g, '') === PHONE.replace(/\D/g, '')}
# A full-screen scroll can hit the sheet's dismissing backdrop. Start inside
# the actual field so only the auth form receives this gesture.
- runFlow:
    when:
      notVisible:
        id: auth-send-code-btn
    commands:
      - swipe:
          from:
            id: auth-phone-field
          direction: UP
- tapOn:
    id: auth-send-code-btn
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: auth-otp-field
    timeout: 15000
- tapOn:
    id: auth-otp-field
    retryTapIfNoChange: false
- waitForAnimationToEnd
- inputText: '123456'
- runFlow:
    when:
      notVisible:
        id: auth-verify-btn
    commands:
      - swipe:
          from:
            id: auth-otp-field
          direction: UP
- tapOn:
    id: auth-verify-btn
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: sign-in-screen
    timeout: 15000
