name: e2e-android

# Dedicated bundled test app; loopback mock only. Never production verification.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATOR_E2E: '1'
      EAS_BUILD_PROFILE: e2e
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: local
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      EXPO_PUBLIC_HTTP_DOMAINS: ''
      EXPO_PUBLIC_ALLOW_DEV_OTP: 'false'
      AUTH_DEV_MODE: 'false'
      EXPO_PUBLIC_AUTH_DEV_MODE: 'false'
      EXPO_PUBLIC_SENTRY_DSN: ''
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      # ubuntu-latest ships ~14GB free, which this job exhausts (node_modules +
      # Expo prebuild + Gradle release build + AVD system image + emulator
      # userdata), and the runner dies mid-emulator with ENOSPC. Reclaim ~20GB
      # of preinstalled toolchains this job never touches.
      #
      # Deliberately NOT removed: the Android SDK's `ndk` directory. RN 0.85 /
      # Expo 56 build the New Architecture by default, which compiles Fabric and
      # TurboModule C++ through externalNativeBuild and needs the NDK present.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/share/powershell \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify production guard and test configuration
        env:
          MATOR_E2E: ''
          EAS_BUILD_PROFILE: ''
        run: npm test -- tests/environment-release.test.ts tests/environment-runtime.test.ts tests/production-transport-boundary.test.ts tests/e2e-mock.test.ts

      - name: Run Expo Prebuild for dedicated test app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated test identity and HTTP manifest
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          const manifest = fs.readFileSync('android/app/src/main/AndroidManifest.xml', 'utf8');
          if (!gradle.includes("applicationId 'com.mator.e2e'")) throw Error('Wrong test application ID');
          if (!manifest.includes('android:usesCleartextTraffic="true"')) throw Error('Mock HTTP unavailable');
          if (!manifest.includes('android:scheme="mator-e2e"')) throw Error('Wrong test scheme');
          NODE

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (JS bundled, debug-signed)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -x lint -PreactNativeArchitectures=x86_64

      # The APK is all we need from here on. Gradle's daemon/build dirs and the
      # transform caches are several GB that would otherwise still be resident
      # when the AVD image and userdata partition get written.
      - name: Reclaim space after the build
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/app-release.apk
          rm -rf android/app/build android/build ~/.gradle/daemon
          mkdir -p android/app/build/outputs/apk/release
          cp /tmp/app-release.apk android/app/build/outputs/apk/release/app-release.apk
          df -h /

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: |
            adb reverse tcp:8080 tcp:8080          # emulator localhost:8080 -> host mock
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            bash scripts/e2e.sh .maestro/flows/flow-12-favorites-isolation.yaml --format junit --output maestro-report.xml

      - name: Scrub text artifacts
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['maestro-report.xml', '/tmp/mator-e2e-mock.log']) {
            if (!fs.existsSync(path)) continue;
            const text = fs.readFileSync(path, 'utf8')
              .replace(/\+?998[\d ()-]{9,}/g, '[TEST_PHONE]')
              .replace(/srv_(?:access|refresh)_[a-z0-9_]+/g, '[TEST_TOKEN]');
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            /tmp/mator-e2e-mock.log
          if-no-files-found: ignore
          retention-days: 14
