appId: com.mator.e2e
---
- openLink: mator-e2e://sign-in
- extendedWaitUntil:
    visible:
      id: auth-phone-field
    timeout: 15000
- waitForAnimationToEnd
- copyTextFrom:
    id: auth-phone-field
- assertTrue: ${maestro.copiedText === '' || maestro.copiedText === '+998 90 123 45 67'}
- tapOn:
    id: auth-phone-field
- inputText: ${PHONE}
- scrollUntilVisible:
    element:
      id: auth-send-code-btn
    direction: DOWN
- tapOn:
    id: auth-send-code-btn
- extendedWaitUntil:
    visible:
      id: auth-otp-field
    timeout: 15000
- tapOn:
    id: auth-otp-field
- inputText: '123456'
- scrollUntilVisible:
    element:
      id: auth-verify-btn
    direction: DOWN
- tapOn:
    id: auth-verify-btn
- extendedWaitUntil:
    notVisible:
      id: sign-in-screen
    timeout: 15000
