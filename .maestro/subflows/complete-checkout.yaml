# ─────────────────────────────────────────────────────────────────────────────
# Reusable subflow: from a Cart holding at least one item, go through Checkout
# and place the order, landing on Order Confirmation.
#
# Precondition: on the Cart screen, signed in, cart non-empty (call
# add-item-authenticated.yaml first). Checkout runs on the mocked orders
# contract (addresses / payment-methods / shipping quote / create order).
#
# testIDs: cart-checkout-btn · checkout-screen · checkout-place-order-btn ·
#          order-confirmation-screen.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.fotih12.mator
---
- tapOn:
    id: "cart-checkout-btn"
- extendedWaitUntil:
    visible:
      id: "checkout-screen"
    timeout: 8000
- assertVisible:
    id: "checkout-place-order-btn"
# The button is disabled until the delivery price is in.
- extendedWaitUntil:
    visible:
      id: "checkout-delivery-price"
    timeout: 8000
# Cash: Payme opens a real browser page and confirms by webhook, which a mock cannot do,
# and anything short of that (rightly) stays on the checkout as unpaid.
- tapOn:
    text: ".*(Наличные|Naqd pul|Cash).*"
- tapOn:
    id: "checkout-place-order-btn"
- extendedWaitUntil:
    visible:
      id: "order-confirmation-screen"
    timeout: 12000
