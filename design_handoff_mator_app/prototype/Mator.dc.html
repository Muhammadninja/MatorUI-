  .mator-scroll::-webkit-scrollbar{display:none}
  .mator-scroll{scrollbar-width:none;-ms-overflow-style:none}
  @keyframes matorFade{from{transform:translateY(8px)}to{transform:none}}
  .mator-enter{animation:matorFade .26s ease both}
  @keyframes matorPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  @keyframes matorToast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes matorSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes matorScan{0%{top:8%}50%{top:88%}100%{top:8%}}
  @keyframes matorSpin{to{transform:rotate(360deg)}}
  @keyframes matorDrop{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
</style>

        d: 'M52,82 L44,95.86 L28,95.86 L20,82 L28,68.14 L44,68.14 Z M43.5,82 A7.5,7.5 0 1 0 28.5,82 A7.5,7.5 0 1 0 43.5,82 Z' }));

  wheelGlyph(e, color, S, spin) {
    const h = S * 1.04;
    const spokes = [0, 72, 144, 216, 288].map(a => {
      const r = (a - 90) * Math.PI / 180;
      return e('line', { key: 'sp' + a, x1: 50, y1: 50, x2: 50 + 30 * Math.cos(r), y2: 50 + 30 * Math.sin(r), stroke: color, strokeWidth: 9, strokeLinecap: 'round' });
    });
    const lugs = [36, 108, 180, 252, 324].map(a => {
      const r = (a - 90) * Math.PI / 180;
      return e('circle', { key: 'lg' + a, cx: 50 + 15 * Math.cos(r), cy: 50 + 15 * Math.sin(r), r: 2.6, fill: color });
    });
    return e('svg', { viewBox: '0 0 100 100', width: h, height: h, style: { display: 'block', transformOrigin: '50% 50%', animation: spin ? 'matorSpin 2.6s linear infinite' : 'none' }, 'aria-hidden': true },
      e('circle', { cx: 50, cy: 50, r: 45, fill: 'none', stroke: color, strokeWidth: 10 }),

      ...spokes,
      e('circle', { cx: 50, cy: 50, r: 11, fill: color }),
      ...lugs);

  engineA(e, color, S) {
    // letter A as a V-twin: two ribbed cylinder banks + crossbar + spark plug
    const apex = { x: 34, y: 17 }, lf = { x: 7, y: 93 }, rf = { x: 61, y: 93 };
    const leg = (k, A, F) => e('line', { key: k, x1: A.x, y1: A.y, x2: F.x, y2: F.y, stroke: color, strokeWidth: 15, strokeLinecap: 'butt', strokeDasharray: '8.5 5' });
    // crossbar meeting point on each leg (~t 0.58)

    this.setState(s => ({ history: [...s.history, { screen: s.screen, params: s.params }], screen, params, sheet: null }));
  }

    this.setState(s => {
      if (!s.history.length) return { sheet: null };
      const h = [...s.history]; const last = h.pop();
      return { history: h, screen: last.screen, params: last.params, sheet: null };
    });
  }

    clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: null }), 2200);
