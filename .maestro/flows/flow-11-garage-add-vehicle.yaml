# ─────────────────────────────────────────────────────────────────────────────
# FLOW 11 — Add a vehicle by make / model / year  (Garage, stepped picker sheet)
#
# Covers the route rebuilt in Sep 2026: every unlabelled "add" affordance opens
# a three-step sheet over the PLATFORM's own picker (make → model → year), and
# only an explicitly VIN-labelled control reaches the VIN screen. Flow 01 covers
# the VIN route; nothing covered this one.
#
# Reference data: the picker reads `/v1/reference/makes|models`, which the mock
# server does not serve. That is FINE and deliberate — `fetchMakes`/`fetchModels`
# catch a failing backend and fall back to the bundled UZ catalog
# (`services/uz-vehicle-catalog.ts`), so the sheet fills from
# UZ_BRANDS[0] = Chevrolet and UZ_MODELS[0] = Cobalt.
#
# Why no scrolling of the wheel: opening a field COMMITS the row the picker
# centres (`AppNativePickerField`), so the first option is selected by the tap
# that opens it. Three taps of "Continue" therefore produce
# `Chevrolet · Cobalt · <current year>` with no gesture Maestro cannot make.
#
# Guests are gated: `startAdd` routes to /sign-in?gate=1 BEFORE the sheet opens,
# so the sheet is reached on the second tap, after auth.
#
# testIDs: vehicle-make-picker · vehicle-model-picker · vehicle-year-picker ·
#          picker-step-next · picker-step-back · use-vin-instead
# ─────────────────────────────────────────────────────────────────────────────
appId: com.fotih12.mator
env:
  FIXTURE_MAKE: "Chevrolet"
  FIXTURE_MODEL: "Cobalt"
---
# ── Arrange: fresh launch, then the Garage tab as a guest ────────────────────
- runFlow: ../subflows/launch-clean.yaml
# Deep link rather than a tab tap: the tab bar exposes no testIDs, and the
# icons carry no text to match on (flow 10 reaches its screen the same way).
- openLink: "mator://garage"
- extendedWaitUntil:
    visible: "By model and year"
    timeout: 8000

# ── Act 1: the quick route is gated — auth first, then the sheet ─────────────
- tapOn: "By model and year"
- runFlow: ../subflows/sign-in-submit.yaml
# Back on the Garage, now authenticated: the same control opens the sheet.
- tapOn: "By model and year"
- extendedWaitUntil:
    visible:
      id: "vehicle-make-picker"
    timeout: 8000

# ── Assert: step one asks for the make ALONE, and nothing is pre-selected ────
- assertVisible: "Pick your car's brand"
- assertNotVisible:
    id: "vehicle-model-picker"
- assertNotVisible:
    id: "vehicle-year-picker"
# The escape hatch to the precise route is offered here and only here.
- assertVisible:
    id: "use-vin-instead"
- takeScreenshot: artifacts/flow-11-step-make

# ── Act 2: make → model → year, one tap to open each, one to continue ────────
- tapOn:
    id: "vehicle-make-picker"
- assertVisible: "${FIXTURE_MAKE}"
- tapOn:
    id: "picker-step-next"

- extendedWaitUntil:
    visible:
      id: "vehicle-model-picker"
    timeout: 8000
# The answer so far rides along next to the back arrow.
- assertVisible: "${FIXTURE_MAKE}"
- tapOn:
    id: "vehicle-model-picker"
- assertVisible: "${FIXTURE_MODEL}"
- tapOn:
    id: "picker-step-next"

- extendedWaitUntil:
    visible:
      id: "vehicle-year-picker"
    timeout: 8000
- tapOn:
    id: "vehicle-year-picker"
- takeScreenshot: artifacts/flow-11-step-year
- tapOn:
    id: "picker-step-next"

# ── Assert: the car is in the garage and is the one being shopped for ────────
- extendedWaitUntil:
    notVisible:
      id: "vehicle-year-picker"
    timeout: 10000
- extendedWaitUntil:
    visible: "${FIXTURE_MODEL}"
    timeout: 10000
- assertVisible: "Shop parts that fit"
- takeScreenshot: artifacts/flow-11-garage-with-vehicle
