appId: com.mator.e2e
name: flow-12-favorites-isolation
tags:
  - favorites
  - isolated
---
# Only this disposable test app is cleared. Production app has a different ID.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "English, English"
    timeout: 30000
- tapOn: "English, English"
- tapOn: "Continue"
- runFlow:
    file: ../subflows/favorites-sign-in.yaml
    env:
      PHONE: '+998900000001'
- runFlow:
    file: ../subflows/favorites-save-catalog.yaml
    env:
      PART_ID: brembo-fp
- openLink: mator-e2e://liked
- extendedWaitUntil:
    visible:
      id: liked-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: part-card-brembo-fp
    timeout: 15000
- runFlow: ../subflows/favorites-sign-out.yaml
# Reopening auth proves sign-out did not retain A's phone.
- runFlow:
    file: ../subflows/favorites-sign-in.yaml
    env:
      PHONE: '+998900000002'
- openLink: mator-e2e://liked
- extendedWaitUntil:
    visible:
      id: liked-screen
    timeout: 15000
- assertVisible:
    id: liked-empty
- assertNotVisible:
    id: part-card-brembo-fp
- runFlow:
    file: ../subflows/favorites-save-catalog.yaml
    env:
      PART_ID: bosch-rotor
- openLink: mator-e2e://liked
- extendedWaitUntil:
    visible:
      id: liked-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: part-card-bosch-rotor
    timeout: 15000
- runFlow: ../subflows/favorites-sign-out.yaml
- runFlow:
    file: ../subflows/favorites-sign-in.yaml
    env:
      PHONE: '+998900000001'
- openLink: mator-e2e://liked
- extendedWaitUntil:
    visible:
      id: liked-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: part-card-brembo-fp
    timeout: 15000
- assertNotVisible:
    id: part-card-bosch-rotor
# A process restart, with storage and session preserved.
- stopApp
- launchApp
- openLink: mator-e2e://liked
- extendedWaitUntil:
    visible:
      id: liked-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: part-card-brembo-fp
    timeout: 30000
- assertNotVisible:
    id: part-card-bosch-rotor
# The restored list must belong to an authenticated session.
- openLink: mator-e2e://profile
- scrollUntilVisible:
    element:
      id: profile-sign-out
    direction: DOWN
- assertVisible:
    id: profile-sign-out
- openLink: mator-e2e://liked
- extendedWaitUntil:
    visible:
      id: liked-screen
    timeout: 15000
- assertVisible:
    id: part-card-brembo-fp
- assertNotVisible:
    id: part-card-bosch-rotor
# Only the final product list is captured; no auth/profile fields are saved.
- takeScreenshot: favorites-a-after-restart
