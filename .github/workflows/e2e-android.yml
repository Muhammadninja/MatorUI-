name: e2e-android

# Offline Maestro E2E on an Android emulator.
#
# Strategy (why this is robust): build a RELEASE APK. Expo's Android template
# signs `release` with the debug keystore (android/app/build.gradle:
# `signingConfig signingConfigs.debug`), so the APK is installable with no
# credentials, has the JS bundled (no Metro), and no Expo dev launcher — which
# sidesteps every dev-client caching problem we hit locally. The mock base URL is
# baked at build time from `.env.production.local` (release builds bundle with
# NODE_ENV=production, so that file is highest precedence). The emulator reaches
# the host mock via `adb reverse tcp:8080 tcp:8080`, so the app uses
# `http://localhost:8080` exactly like on the local iOS sim.
#
# First-run notes: Gradle build is ~10-15 min (cached after). Emulator needs KVM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Highest-precedence env file for a production/release JS bundle. A fresh CI
      # checkout has no .env.local, so this cleanly points every transport + the
      # VIN decode at the mock. Empty HTTP_DOMAINS => all domains use HTTP.
      - name: Point the app at the local mock
        run: |
          printf 'EXPO_PUBLIC_API_BASE_URL=http://localhost:8080\nEXPO_PUBLIC_HTTP_DOMAINS=\n' > .env.production.local

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (JS bundled, debug-signed)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -x lint

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start mock server
        run: |
          node .maestro/mock-server/standalone-server.mjs > mock.log 2>&1 &
          # Wait until it answers before handing off to the emulator step.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: |
            adb reverse tcp:8080 tcp:8080          # emulator localhost:8080 -> host mock
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/ --format junit --output maestro-report.xml

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
            mock.log
          if-no-files-found: ignore
          retention-days: 14
