# ═════════════════════════════════════════════════════════════════════════════
# FLOW 3 — Dynamic Parts Filtering  (Stage 3 / AutoZone flow)
# ═════════════════════════════════════════════════════════════════════════════
# Mock the brakes parts list (2 items), assert both render, apply a brand filter
# via the inline quick-filter chips, assert the list reacts dynamically.
#
# Mocked endpoint (../mock-server): GET /v1/catalog/parts?systemId=brakes
#   (the live app sends ?category=brakes — the mock matches both)
#   res: { items: [Brembo Front Brake Pads, Bosch Brake Rotor], total: 2 }
#
# testIDs: parts-directory-screen · part-card-<id> · quick-filters ·
#          filter-brand-<Brand> · filter-clear-btn
#
# There is NO bottom sheet: the quick-filter row holds tappable brand CHIPS that
# apply immediately on tap (no Apply). A "Clear" chip appears while any filter is
# active. Brand chips are derived from the fetched page → "Bosch", "Brembo".
# ═════════════════════════════════════════════════════════════════════════════
appId: com.fotih12.mator
name: flow-03-parts-filter
tags:
  - stage3
  - catalog
  - filter
# Per-flow env defaults (used by the seed subflow) so the flow runs standalone.
env:
  FIXTURE_VIN: "1G1AK55F877123456"
  FIXTURE_YEAR: "2022"
  FIXTURE_MAKE: "CHEVROLET"
  FIXTURE_MODEL: "Cobalt"
---
# ── Arrange: launch, decode VIN, open the brakes parts directory ─────────────
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/seed-active-vehicle.yaml
- tapOn: { id: "system-item-brakes" }
- assertVisible:
    id: "parts-directory-screen"

# ── Assert: both mocked parts render ─────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "part-card-brembo-fp"
    timeout: 8000
- assertVisible: { id: "part-card-brembo-fp" }
- assertVisible: { id: "part-card-bosch-rotor" }
- assertVisible:
    text: "Brembo Front Brake Pads"
- assertVisible:
    text: "Bosch Brake Rotor"

# ── Act: constrain to a single brand via the inline quick-filter chip ────────
# The brand chips sit at the far end of the horizontal quick-filter row, so
# scroll it into view before tapping. Tapping applies immediately (no Apply).
- scrollUntilVisible:
    element:
      id: "filter-brand-Brembo"
    direction: RIGHT
    timeout: 6000
- tapOn:
    id: "filter-brand-Brembo"

# ── Assert: the list adjusts dynamically ─────────────────────────────────────
# Brembo stays, Bosch drops out. The absence assertion is the real proof the
# filter did something — presence alone could be a no-op.
- assertVisible: { id: "part-card-brembo-fp" }
- assertNotVisible:
    id: "part-card-bosch-rotor"
- assertNotVisible:
    text: "Bosch Brake Rotor"
- assertVisible:
    text: ".*1 part.*"                 # result-count line reflects the single match

- takeScreenshot: artifacts/flow-03-brand-filtered

# ── Teardown: tap the Clear chip, assert both parts return (list is reactive) ─
# The Clear chip sits at the START of the quick-filter row, so scroll back left.
- scrollUntilVisible:
    element:
      id: "filter-clear-btn"
    direction: LEFT
    timeout: 6000
- tapOn:
    id: "filter-clear-btn"
- assertVisible: { id: "part-card-brembo-fp" }
- assertVisible: { id: "part-card-bosch-rotor" }
